name: Hlidac aut

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  hledat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Spustit hledani
        run: python scraper.py
      - name: Ulozit vysledky
        run: |
          git config user.name "hlidac-bot"
          git config user.email "actions@github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Aktualizace nabidek"
          git push
